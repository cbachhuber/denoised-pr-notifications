name: PR activity to Teams

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "Replay from this UTC timestamp, e.g. 2026-09-08T14:00:00+00:00 (blank uses the watermark)"
        required: false
        type: string

concurrency:
  group: pr-teams-notify

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Cache keys are immutable, so each run writes a new one and restore-keys picks the newest.
      - name: Restore watermark
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: watermark-${{ github.run_id }}
          restore-keys: watermark-

      # Pinned: resolving "latest" calls the github.com API, which a GitHub Enterprise GITHUB_TOKEN cannot authenticate.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Collect and notify
        run: uv run pr_notify.py
        env:
          GH_TOKEN: ${{ secrets.PR_NOTIFY_TOKEN }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          SINCE: ${{ inputs.since }}

      - name: Save watermark
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: watermark-${{ github.run_id }}
