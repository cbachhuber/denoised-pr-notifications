[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pyjwt[crypto]>=2.15.1",
  "pytest",
  "requests>=2.34.2"
]

[project]
name = "denoised-pr-notifications"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
pr-notify = "denoised_pr_notifications.pr_notify:main"

[tool.hatch.build.targets.wheel]
packages = ["src/denoised_pr_notifications"]

[tool.pytest.ini_options]
addopts = "-m 'not e2e'"
markers = ["e2e: runs run.sh against github.com and a local webhook sink (pytest -m e2e)"]

[tool.rumdl.MD013]
require-sentence-per-line = true
reflow = true
line-length = 10000
code-blocks = false
tables = false
